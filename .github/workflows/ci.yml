name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: warden
          POSTGRES_PASSWORD: warden
          POSTGRES_DB: warden_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warden"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI database; enables the PostgreSQL variants of the store tests.
      WARDEN_TEST_POSTGRES_URL: postgresql+psycopg://warden:warden@localhost:5432/warden_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked --all-extras
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      - name: Test
        run: uv run pytest --cov=mcp_warden --cov-report=term-missing
      - name: Validate example policy
        run: uv run mcp-warden check examples/policy.yaml
      - name: Build
        run: uv build
