name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: warden
          POSTGRES_PASSWORD: warden
          POSTGRES_DB: warden_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warden"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI database; enables the PostgreSQL variants of the store tests.
      WARDEN_TEST_POSTGRES_URL: postgresql+psycopg://warden:warden@localhost:5432/warden_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked --all-extras
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      - name: Test
        run: uv run pytest --cov=mcp_warden --cov-report=term-missing
      - name: Validate example policy
        run: uv run mcp-warden check examples/policy.yaml
      - name: Build
        run: uv build

  clean-clone:
    # The README's setup path without Docker, from a fresh checkout: install
    # the locked dependencies, migrate a SQLite database, start the fake
    # upstream and the gateway as processes and run the demo agent.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Lint the shell scripts
        run: shellcheck scripts/*.sh
      - name: Install
        run: uv sync --locked
      - name: Run the local demo
        run: scripts/local-demo.sh

  compose:
    # The container image and the Compose stack, end to end: PostgreSQL,
    # migrations, the fake upstream and the gateway, with the scripted demo
    # agent run twice (the second run proves it can be repeated).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - name: Write throwaway secrets
        run: |
          umask 077
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "WARDEN_ADMIN_TOKEN=$(openssl rand -hex 24)"
            echo "WARDEN_AUDIT_HASH_KEY=$(openssl rand -hex 24)"
          } > .env
      - name: Build the image
        run: docker compose build
      - name: The image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id mcp-warden:local -u)" = "10001"
      - name: Start the stack
        run: docker compose up --detach
      - name: Run the demo
        run: docker compose --profile demo run --rm demo
      - name: Run the demo again
        run: docker compose --profile demo run --rm demo
      - name: The gateway is healthy
        run: test "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q warden)")" = "healthy"
      - name: Show logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose --profile demo down --volumes
