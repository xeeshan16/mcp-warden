# For authoring migrations only (e.g. `uv run alembic revision --autogenerate -m "..."`).
# The database URL comes from WARDEN_DATABASE_URL; the gateway applies migrations
# with `mcp-warden db upgrade` and does not need this file.
[alembic]
script_location = src/mcp_warden/db/migrations
file_template = %%(rev)s_%%(slug)s
