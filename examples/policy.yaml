# Example MCP Warden policy.
#
# Resolution: every matching rule is collected and the most restrictive effect
# wins (deny > require_approval > allow). Rule order never weakens a deny.
# If nothing matches, `default` applies.
version: 1
default: deny

rules:
  - id: read-only-everywhere
    effect: allow
    description: Any agent may use read-style tools on any server.
    tools: ["get_*", "list_*", "search_*", "read_*"]

  - id: support-bot-tickets
    effect: allow
    description: The support bot may create and update tickets.
    agents: ["support-bot"]
    servers: ["tickets"]
    tools: ["create_ticket", "update_ticket"]

  - id: writes-need-a-human
    effect: require_approval
    description: Writes to source control need human sign-off.
    servers: ["github"]
    tools: ["create_*", "update_*", "merge_*", "push_*"]

  - id: never-destructive
    effect: deny
    description: Destructive tools are never allowed through the gateway.
    tools: ["delete_*", "drop_*", "*_delete", "purge_*"]

  # --- Argument matchers -----------------------------------------------------
  # A rule with `arguments` only applies when every matcher holds for the
  # tools/call arguments. Operators: equals, one_of, glob, regex (whole value),
  # present, max_length, min/max. `not: true` negates a matcher, and a missing
  # argument never satisfies an operator other than `present: false`.

  - id: no-pushes-to-default-branch
    effect: deny
    description: Agents never write to the default branch, even with approval.
    servers: ["github"]
    tools: ["push_*", "create_or_update_file"]
    arguments:
      - {path: branch, one_of: ["main", "master"]}

  - id: demo-basics
    effect: allow
    description: Any agent may use the demo server's harmless tools.
    servers: ["demo"]
    tools: ["echo", "add", "sleep"]

  - id: short-sleeps-only
    effect: deny
    description: Calls that would hold an upstream worker for more than two seconds.
    servers: ["demo"]
    tools: ["sleep"]
    arguments:
      # Also denies a missing or non-numeric `seconds`: fail closed.
      - {path: seconds, min: 0, max: 2, not: true}

  - id: support-bot-demo-tickets
    effect: allow
    description: The support bot may open demo tickets with a reasonably short title.
    agents: ["support-bot"]
    servers: ["demo"]
    tools: ["create_ticket"]
    arguments:
      - {path: title, max_length: 120}

  - id: urgent-tickets-need-a-human
    effect: require_approval
    description: An urgent ticket pages someone, so a person signs it off first.
    agents: ["support-bot"]
    servers: ["demo"]
    tools: ["create_ticket"]
    arguments:
      - {path: priority, equals: urgent}

# --- Human approval ----------------------------------------------------------
# A call that ends up `require_approval` is parked as an approval request and
# the agent gets error -32002 with an `approval_id`. A reviewer approves or
# denies it (admin API or `mcp-warden approvals`), and the agent repeats the
# identical call to collect the decision: approved calls run once, denied
# ones get -32001 with the reviewer's note. Timeouts are runtime settings
# (WARDEN_APPROVAL_*), not part of the policy.

# --- Rate limits -------------------------------------------------------------
# Token buckets on tools/call, checked after the rules (a denied call never
# spends a token). `requests` per `per` (second, minute, hour, day) is the
# sustained rate and `burst` the bucket size (defaults to `requests`).
# `scope: agent` shares one bucket per agent across every matching call;
# `scope: tool` keeps one per agent, server and tool. A call needs a token
# from every limit that matches it; a refused call gets error -32003 with
# `retry_after` seconds.
rate_limits:
  - id: per-agent
    description: Overall ceiling for any one agent.
    requests: 120
    per: minute
    burst: 30

  - id: source-control-writes
    description: Each write tool on GitHub, per agent.
    servers: ["github"]
    tools: ["create_*", "update_*", "merge_*", "push_*"]
    scope: tool
    requests: 20
    per: hour
    burst: 5

  - id: demo-tickets
    description: Ticket creation on the demo server, per agent.
    servers: ["demo"]
    tools: ["create_ticket"]
    scope: tool
    requests: 3
    per: minute

# --- Budgets -----------------------------------------------------------------
# Quotas on tools/call per fixed UTC window (hour, day, week starting Monday,
# month), checked after the rate limits (a rate-limited call spends no
# budget). `max_calls` caps the number of calls; `max_tokens` caps estimated
# tokens of the call's arguments plus the tool's reply. A budget needs at
# least one of the two. `scope` works as for rate limits. A refused call gets
# error -32004 with `resets_at` and `retry_after`; usage resets when the next
# window starts.
budgets:
  - id: daily-calls
    description: Any one agent makes at most 2,000 tool calls a day.
    window: day
    max_calls: 2000

  - id: support-bot-tokens
    description: The support bot's daily token allowance across all servers.
    agents: ["support-bot"]
    window: day
    max_tokens: 200000

  - id: demo-echo
    description: Echo on the demo server, per agent, each hour.
    servers: ["demo"]
    tools: ["echo"]
    scope: tool
    window: hour
    max_calls: 50
    max_tokens: 5000
